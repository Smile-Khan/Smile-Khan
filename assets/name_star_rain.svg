<svg fill="none" viewBox="0 0 1000 160" width="1000" height="160" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes gradientText {
				  0% { background-position: 0% 50%; }
				  50% { background-position: 100% 50%; }
				  100% { background-position: 0% 50%; }
				}
				h1 {
				  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
					'Fira Sans', 'Helvetica Neue', sans-serif;
				  margin: 0;
				  padding-top: 28px;
				  font-size: 3.2em;
				  font-weight: 900;
				  letter-spacing: -.03em;
				  text-align: center;
				  background: linear-gradient(270deg, #53D4FF, #8A5CFF, #53D4FF);
				  background-size: 400%;
				  background-clip: text;
				  -webkit-background-clip: text;
				  -webkit-text-fill-color: transparent;
				  animation: gradientText 4s ease infinite;
				}
				h2 {
				  font-family: 'Fira Code', monospace;
				  margin: 0;
				  font-size: 1em;
				  font-weight: 500;
				  text-align: center;
				  color: #8b93a7;
				  letter-spacing: .02em;
				}
				@keyframes star-fall { 0% { top: -10%; } 100% { top: 110%; } }
				@keyframes star-drift {
				  0% { transform: translateX(0px) rotate(0deg); }
				  50% { transform: translateX(40px) rotate(180deg); }
				  100% { transform: translateX(0px) rotate(360deg); }
				}
				@keyframes star-twinkle {
				  0%, 100% { opacity: .25; }
				  50% { opacity: 1; }
				}
				.star {
				  position: fixed;
				  top: -10%;
				  z-index: 9999;
				  color: #ffffff;
				  text-shadow: 0 0 4px #53D4FF, 0 0 2px #000000;
				  user-select: none;
				  animation-name: star-fall, star-drift, star-twinkle;
				  animation-timing-function: linear, ease-in-out, ease-in-out;
				  animation-iteration-count: infinite, infinite, infinite;
				}
				.star:nth-of-type(1){ left:2%;  font-size:.7em;  animation-duration:9s,3s,2s;   animation-delay:0s,0s,0s; }
				.star:nth-of-type(2){ left:10%; font-size:1.1em; animation-duration:12s,4s,2.4s; animation-delay:1s,.5s,.3s; }
				.star:nth-of-type(3){ left:18%; font-size:.6em;  animation-duration:7s,2.5s,1.6s; animation-delay:2.5s,1s,.6s; }
				.star:nth-of-type(4){ left:27%; font-size:.9em;  animation-duration:10s,3.5s,2.2s; animation-delay:.5s,2s,1s; }
				.star:nth-of-type(5){ left:35%; font-size:1.3em; animation-duration:13s,5s,2.8s; animation-delay:4s,1.5s,.4s; }
				.star:nth-of-type(6){ left:44%; font-size:.7em;  animation-duration:8s,3s,1.8s; animation-delay:1.5s,0s,1.2s; }
				.star:nth-of-type(7){ left:53%; font-size:1em;   animation-duration:11s,4s,2.5s; animation-delay:3s,2.5s,.2s; }
				.star:nth-of-type(8){ left:61%; font-size:.6em;  animation-duration:9.5s,3s,2s; animation-delay:.8s,.8s,1.5s; }
				.star:nth-of-type(9){ left:69%; font-size:1.2em; animation-duration:14s,5.5s,3s; animation-delay:5s,1s,.7s; }
				.star:nth-of-type(10){ left:77%; font-size:.8em; animation-duration:10.5s,3.5s,2.1s; animation-delay:2s,3s,1.1s; }
				.star:nth-of-type(11){ left:85%; font-size:1.1em; animation-duration:12.5s,4.5s,2.6s; animation-delay:.2s,1.2s,.5s; }
				.star:nth-of-type(12){ left:93%; font-size:.7em;  animation-duration:8.5s,2.8s,1.9s; animation-delay:3.5s,.4s,1.4s; }
				.star:nth-of-type(13){ left:6%;  font-size:.5em;  animation-duration:15s,6s,3.2s; animation-delay:6s,2.2s,.9s; }
				.star:nth-of-type(14){ left:49%; font-size:.5em;  animation-duration:16s,5s,2.7s; animation-delay:7s,3.3s,1.6s; }
			</style>
			<div class="star">✦</div>
			<div class="star">⭐</div>
			<div class="star">✧</div>
			<div class="star">✦</div>
			<div class="star">⭐</div>
			<div class="star">✧</div>
			<div class="star">✦</div>
			<div class="star">⭐</div>
			<div class="star">✧</div>
			<div class="star">✦</div>
			<div class="star">⭐</div>
			<div class="star">✧</div>
			<div class="star">✦</div>
			<div class="star">✧</div>
			<h1>Pathan Ismailkhan</h1>
			<h2>Full-Stack Software Engineer &#183; Distributed Systems</h2>
		</div>
	</foreignObject>
</svg>
